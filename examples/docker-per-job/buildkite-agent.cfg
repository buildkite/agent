# Agent configuration for the docker-per-job prototype.
# Also set BUILDKITE_CONTAINER_COUNT=1 in the agent's environment (see README).

token="REPLACE_ME"
name="%hostname-docker-per-job"
tags="queue=docker-per-job"

# One worker per dedicated Docker daemon. Cleanup removes everything on the
# daemon that isn't kept, so a second worker's job would be destroyed.
spawn=1

# Hand each job to `buildkite-agent kubernetes-bootstrap` in the container
# that hooks/pre-bootstrap starts, over a socket in job-context-dir.
kubernetes-exec=true
job-context-dir="/var/lib/buildkite-agent/docker-per-job/context"
kubernetes-container-start-timeout="5m"

# These must match docker-per-job.env and exist at the same paths in the job
# container (pre-bootstrap mounts the hooks directory there).
build-path="/var/lib/buildkite-agent/builds"
hooks-path="/etc/buildkite-agent/docker-per-job/hooks"
