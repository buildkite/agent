steps:
  - wait

  - name: ":s3: Upload Binaries to S3"
    command: ".buildkite/steps/publish-to-s3.sh"
    env:
      CODENAME: "stable"
    plugins:
      - aws-assume-role-with-web-identity#v1.4.0:
          role-arn: arn:aws:iam::032379705303:role/pipeline-buildkite-agent-release-stable
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
      - ecr#v2.12.0:
          login: true
          account-ids: "445615400570"
      # RELEASE_TOOLS_IMAGE is built by .buildkite/steps/build-release-image.sh
      # and passed in by the trigger in .buildkite/steps/upload-release-steps.sh
      - docker#v5.14.0: &release_tools
          image: "${RELEASE_TOOLS_IMAGE?}"
          mount-buildkite-agent: true
          propagate-environment: true
          propagate-aws-auth-tokens: true
          # Runtime exporter settings are not in BUILDKITE_ENV_FILE.
          # Forward names so credentials stay out of pipeline uploads.
          environment:
            - OTEL_EXPORTER_OTLP_ENDPOINT
            - OTEL_EXPORTER_OTLP_PROTOCOL
            - OTEL_EXPORTER_OTLP_HEADERS
            - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            - OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
            - OTEL_EXPORTER_OTLP_TRACES_HEADERS
          # publish-debian-package.sh refuses to import signing keys unless this is tmpfs
          tmpfs:
            - "/root/.gnupg:mode=0700"
          # Scratch space for the yum repo in publish-rpm-package.sh
          volumes:
            - "/yum.buildkite.com"

  - name: ":octocat: :rocket: Create Github Release (if necessary)"
    key: github-release
    command: ".buildkite/steps/github-release.sh"
    env:
      CODENAME: "stable"
    plugins:
      - aws-assume-role-with-web-identity#v1.4.0:
          role-arn: arn:aws:iam::032379705303:role/pipeline-buildkite-agent-release-stable
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
      - ecr#v2.12.0:
          login: true
          account-ids: "445615400570"
      - docker#v5.14.0: *release_tools

  - label: ":nix: Publish agent for Nix"
    key: publish-nix
    if: build.branch == "main" && build.env("DRY_RUN") == "false"
    depends_on: github-release
    soft_fail: true
    concurrency: 1
    concurrency_group: "buildkite/agent/nix-release"
    timeout_in_minutes: 10
    env:
      BUILDKITE_SKIP_CHECKOUT: "true"
      BUILDKITE_NO_LOCAL_HOOKS: "true"
    command: |
      set -euo pipefail
      prerelease=$$(buildkite-agent meta-data get agent-is-prerelease)
      if [[ "$$prerelease" == 1 ]]; then
        echo 'Skipping Nix publisher: prerelease'
        exit 0
      fi
      outcome=$$(buildkite-agent step get outcome --step github-release)
      if [[ "$$outcome" != passed ]]; then
        echo 'Skipping Nix publisher: GitHub release did not pass'
        exit 0
      fi
      version=$$(buildkite-agent meta-data get github_release_version)
      export AGENT_RELEASE_TAG="v$$version"

      # The release tag selects the binaries, not the publisher code.
      umask 077
      scratch=$$(mktemp -d)
      trap 'rm -rf "$$scratch"' EXIT
      git clone --quiet --branch main --single-branch https://github.com/buildkite/nix.git "$$scratch/nix"
      cd "$$scratch/nix"

      # IAM requires this pipeline, the main branch, and the publish-nix key.
      buildkite-agent oidc request-token --audience sts.amazonaws.com > "$$scratch/aws-token"
      unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE AWS_DEFAULT_PROFILE
      export AWS_ROLE_ARN=arn:aws:iam::032379705303:role/pipeline-buildkite-agent-release-stable-nix
      export AWS_WEB_IDENTITY_TOKEN_FILE="$$scratch/aws-token"
      GH_TOKEN=$$(aws ssm get-parameter --name /pipelines/nix-publisher/GITHUB_TOKEN --with-decryption --output text --query Parameter.Value --region us-east-1)
      export GH_TOKEN
      scripts/propose-nix-release.sh

  - name: ":redhat: Publish RPM Package"
    command: ".buildkite/steps/publish-rpm-package.sh"
    env:
      CODENAME: "stable"
      RPM_S3_BUCKET: "yum.buildkite.com"
    plugins:
      - aws-assume-role-with-web-identity#v1.4.0:
          role-arn: arn:aws:iam::032379705303:role/pipeline-buildkite-agent-release-stable
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
      - ecr#v2.12.0:
          login: true
          account-ids: "445615400570"
      - docker#v5.14.0: *release_tools
    retry:
      automatic:
        - exit_status: 1
          limit: 3

  - name: ":debian: Publish Debian Package"
    command: ".buildkite/steps/publish-debian-package.sh"
    env:
      CODENAME: "stable"
      DEB_S3_BUCKET: "apt.buildkite.com/buildkite-agent"
    plugins:
      - aws-assume-role-with-web-identity#v1.4.0:
          role-arn: arn:aws:iam::032379705303:role/pipeline-buildkite-agent-release-stable
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
      - ecr#v2.12.0:
          login: true
          account-ids: "445615400570"
      - docker#v5.14.0: *release_tools

  - group: ":docker: Publish Docker Images"
    steps:
      - name: ":docker: Publish Docker Images to {{matrix.registry}}"
        command: ".buildkite/steps/publish-docker-images.sh"
        env:
          CODENAME: "stable"
          REGISTRY: "{{matrix.registry}}"
        plugins:
          - aws-assume-role-with-web-identity#v1.4.0:
              role-arn: arn:aws:iam::032379705303:role/pipeline-buildkite-agent-release-stable
              session-tags:
                - organization_slug
                - organization_id
                - pipeline_slug
                - build_branch
          - ecr#v2.7.0:
              login: true
              account-ids: "445615400570"
        matrix:
          setup:
            registry:
              - docker.io
              - ghcr.io
              - packages.buildkite.com
          adjustments:
            - with: { registry: "packages.buildkite.com" }
              soft_fail: true

  - wait

  - name: ":beer: Publish Homebrew Package"
    command: ".buildkite/steps/release-homebrew.sh"
    artifact_paths: "pkg/*.rb;pkg/*.json"
    env:
      CODENAME: "stable"
    plugins:
      - aws-assume-role-with-web-identity#v1.4.0:
          role-arn: arn:aws:iam::032379705303:role/pipeline-buildkite-agent-release-stable
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
      - ecr#v2.12.0:
          login: true
          account-ids: "445615400570"
      - docker#v5.14.0: *release_tools

  # Runs after the wait above, so the GitHub release and Docker Hub images that
  # the overlay build consumes have been published. Soft-failed like the
  # trigger it uploads, as the agent release is already complete.
  - name: ":pipeline: Upload Namespace agent overlay image trigger"
    command: ".buildkite/steps/trigger-namespace-agent-overlay-image.sh"
    soft_fail: true
