env:
  DRY_RUN: "true"
  BUILDKITE_AGENT_CACHE_REGISTRY: agent-cache
  BUILDKITE_AGENT_CACHE_STORE_URL: "s3://bk-agent-cache-v2-dogfood-445615400570-us-east-1?region=us-east-1"

agents:
  queue: agent-runners-linux-amd64

steps:
  - label: ":package: Once: live cache miss and publish"
    key: once-publish
    command: bash .buildkite/steps/reapi-once-demo.sh miss
    artifact_paths: "once-live-proof/**"
    plugins: &demo-plugins
      - aws-assume-role-with-web-identity#v1.4.0:
          role_arn: arn:aws:iam::445615400570:role/pipeline-buildkite-agent
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
      - docker-compose#v4.14.0:
          config: .buildkite/docker-compose.yml
          cli-version: 2
          mount-buildkite-agent: true
          run: agent
          env:
            - BUILDKITE_AGENT_ACCESS_TOKEN
            - BUILDKITE_AGENT_ENDPOINT
            - BUILDKITE_BUILD_ID
            - BUILDKITE_AGENT_CACHE_REGISTRY
            - BUILDKITE_AGENT_CACHE_STORE_URL
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - AWS_SESSION_TOKEN

  - label: ":recycle: Once: remote hit in a fresh job"
    key: once-restore
    depends_on: once-publish
    command: bash .buildkite/steps/reapi-once-demo.sh hit
    artifact_paths: "once-live-proof/**"
    plugins: *demo-plugins
