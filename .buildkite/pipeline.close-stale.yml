# Pipeline and daily schedule: buildkite/saas-iac, critical-tf/pipelines.tf.
# The schedule starts disabled and in dry-run mode on main at 03:00 UTC.
# Change enabled, STALE_DRY_RUN and STALE_MONTHS there through Terraform.
# AWS role: buildkite/aws-buildkite-dev, oidc-buildkite-agent-close-stale.tf.
# GitHub access: buildkite/ops, github-tf/exchange-lambda.tf. Exchange grants
# Issues and Pull requests write access only to buildkite/agent on verified main
# builds. Apply both permissions changes before running this pipeline.
# The command obtains a short-lived GH_TOKEN directly from Exchange, so runners
# don't need stored GitHub credentials to clone a private authentication plugin.
# Never run this pipeline on PR branches.

agents:
  queue: agent-runners-linux-amd64

steps:
  - label: ":broom: Close stale issues and PRs"
    if: build.branch == "main" && build.pull_request.id == null
    concurrency: 1
    concurrency_group: agent-close-stale
    timeout_in_minutes: 30
    env:
      STALE_DRY_RUN: "${STALE_DRY_RUN:-true}"
      STALE_MONTHS: "${STALE_MONTHS:-12}"
    plugins:
      - aws-assume-role-with-web-identity#v1.4.0:
          role-arn: arn:aws:iam::445615400570:role/pipeline-buildkite-agent-close-stale
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
    command: .buildkite/steps/close-stale.sh
