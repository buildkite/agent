steps:
  - wait

  - name: ":s3: Upload Oldstable Binaries to S3"
    command: ".buildkite/steps/publish-to-s3.sh"
    env:
      CODENAME: "oldstable"
    plugins:
      - aws-assume-role-with-web-identity#v1.4.0:
          role-arn: arn:aws:iam::032379705303:role/pipeline-buildkite-agent-release-oldstable
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
      - ecr#v2.12.0:
          login: true
          account-ids: "445615400570"
      # RELEASE_TOOLS_IMAGE is built by .buildkite/steps/build-release-image.sh
      # and passed in by the trigger in .buildkite/steps/upload-release-steps.sh
      - docker#v5.14.0: &release_tools
          image: "${RELEASE_TOOLS_IMAGE?}"
          mount-buildkite-agent: true
          propagate-environment: true
          propagate-aws-auth-tokens: true
          # publish-debian-package.sh refuses to import signing keys unless this is tmpfs
          tmpfs:
            - "/root/.gnupg:mode=0700"
          # Scratch space for the yum repo in publish-rpm-package.sh
          volumes:
            - "/yum.buildkite.com"

  - name: ":octocat: :rocket: Create Github Release (if necessary)"
    command: ".buildkite/steps/github-release.sh"
    env:
      CODENAME: "oldstable"
    plugins:
      - aws-assume-role-with-web-identity#v1.4.0:
          role-arn: arn:aws:iam::032379705303:role/pipeline-buildkite-agent-release-oldstable
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
      - ecr#v2.12.0:
          login: true
          account-ids: "445615400570"
      - docker#v5.14.0: *release_tools

  - name: ":redhat: Publish Oldstable RPM Package"
    command: ".buildkite/steps/publish-rpm-package.sh"
    env:
      CODENAME: "oldstable"
      RPM_S3_BUCKET: "yum.buildkite.com"
    plugins:
      - aws-assume-role-with-web-identity#v1.4.0:
          role-arn: arn:aws:iam::032379705303:role/pipeline-buildkite-agent-release-oldstable
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
      - ecr#v2.12.0:
          login: true
          account-ids: "445615400570"
      - docker#v5.14.0: *release_tools
    retry:
      automatic:
        - exit_status: 1
          limit: 3

  - name: ":debian: Publish Oldstable Debian Package"
    command: ".buildkite/steps/publish-debian-package.sh"
    env:
      CODENAME: "oldstable"
      DEB_S3_BUCKET: "apt.buildkite.com/buildkite-agent"
    plugins:
      - aws-assume-role-with-web-identity#v1.4.0:
          role-arn: arn:aws:iam::032379705303:role/pipeline-buildkite-agent-release-oldstable
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
      - ecr#v2.12.0:
          login: true
          account-ids: "445615400570"
      - docker#v5.14.0: *release_tools

  - group: ":docker: Publish Oldstable Docker Images"
    steps:
      - name: ":docker: Publish Oldstable Images to {{matrix.registry}}"
        command: ".buildkite/steps/publish-docker-images.sh"
        env:
          CODENAME: "oldstable"
          REGISTRY: "{{matrix.registry}}"
        plugins:
          - aws-assume-role-with-web-identity#v1.4.0:
              role-arn: arn:aws:iam::032379705303:role/pipeline-buildkite-agent-release-oldstable
              session-tags:
                - organization_slug
                - organization_id
                - pipeline_slug
                - build_branch
          - ecr#v2.7.0:
              login: true
              account-ids: "445615400570"
        matrix:
          setup:
            registry:
              - docker.io
              - ghcr.io
              - packages.buildkite.com
          adjustments:
            - with: { registry: "packages.buildkite.com" }
              soft_fail: true

  - wait

  - name: ":beer: Publish Oldstable Homebrew Package"
    command: ".buildkite/steps/release-homebrew.sh"
    artifact_paths: "pkg/*.rb;pkg/*.json"
    env:
      CODENAME: "oldstable"
    plugins:
      - aws-assume-role-with-web-identity#v1.4.0:
          role-arn: arn:aws:iam::032379705303:role/pipeline-buildkite-agent-release-oldstable
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
      - ecr#v2.12.0:
          login: true
          account-ids: "445615400570"
      - docker#v5.14.0: *release_tools
