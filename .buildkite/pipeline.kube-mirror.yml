# EXPERIMENT: lint and test steps mirrored onto the kube-operator queues in
# the Agent cluster. Uploaded unsigned by the upload-kube-mirror step in
# pipeline.yml. Soft-fail; only the image builds depend on other mirror steps.
#
# Every queue runs the same scripts through kube-toolchain.sh. The sysbox and
# dind queues run them in the step's image:, which the operator chart runs in
# the runner's Docker daemon. The standard queues have no Docker, so they run
# them in the agent container.

steps:
  - group: ":kubernetes: Kube operator standard queues"
    steps:
      - &lint
        name: ":go::robot_face: Lint on {{matrix}}"
        key: kube-native-check-code-committed
        command: .buildkite/steps/kube-toolchain.sh .buildkite/steps/check-code-committed.sh
        soft_fail: true
        agents:
          queue: "{{matrix}}"
        matrix: &standard_queues
          - kube-operator-standard
          - kube-operator-standard-ephemeral

      - &protobuf
        name: ":go::robot_face: Check protobuf generation on {{matrix}}"
        key: kube-native-check-protobuf-generation
        command: .buildkite/steps/kube-toolchain.sh .buildkite/steps/check-protobuf-generation.sh
        env:
          GOBIN: /root/.protobuf-tools/bin
          GOCACHE: /root/.protobuf-tools/gocache
          GOMODCACHE: /root/.protobuf-tools/gomodcache
        soft_fail: true
        agents:
          queue: "{{matrix}}"
        matrix: *standard_queues

      # Mirrors ":linux: Linux AMD64 Tests" without the tests plugin, whose
      # pre-command needs curl and jq on the agent image. bktec mints its own
      # Test Engine token with buildkite-agent oidc, and doesn't upload results
      # unless asked, so the mirror stays out of the suite's data. A matrix
      # can't use parallelism, so each queue runs the whole suite as one node.
      - &tests
        name: ":linux: Linux AMD64 Tests on {{matrix}}"
        key: kube-native-test-linux-amd64
        command: .buildkite/steps/kube-toolchain.sh .buildkite/steps/tests.sh
        env:
          KUBE_TOOLCHAIN_RUBY: "true"
          BUILDKITE_TEST_ENGINE_OIDC: "true"
          BUILDKITE_PARALLEL_JOB: "0"
          BUILDKITE_PARALLEL_JOB_COUNT: "1"
        soft_fail: true
        agents:
          queue: "{{matrix}}"
        matrix: *standard_queues

      # Mirrors ":satellite: Detect Data Races", which runs on arm64. These
      # queues are amd64 only.
      - &race
        name: ":satellite: Detect Data Races on {{matrix}}"
        key: kube-native-test-race
        command: .buildkite/steps/kube-toolchain.sh .buildkite/steps/tests.sh -race
        env:
          KUBE_TOOLCHAIN_RUBY: "true"
          KUBE_TOOLCHAIN_CGO: "true"
          BUILDKITE_TEST_ENGINE_OIDC: "true"
          BUILDKITE_PARALLEL_JOB: "0"
          BUILDKITE_PARALLEL_JOB_COUNT: "1"
        soft_fail: true
        agents:
          queue: "{{matrix}}"
        matrix: *standard_queues

      # Mirrors the "Binary builds" matrix, without the provenance attestation.
      # One queue per runtime: a third matrix dimension would exceed the 12
      # adjustments a matrix allows. Only the sysbox builds upload artifacts:
      # the image builds download pkg/ by path, which must be unique.
      - &binary
        name: ":{{matrix.os}}: Build {{matrix.os}} {{matrix.arch}} binary on kube-operator-standard"
        key: kube-native-build-binary
        command: .buildkite/steps/kube-toolchain.sh .buildkite/steps/build-binary.sh {{matrix.os}} {{matrix.arch}}
        env:
          KUBE_TOOLCHAIN_GO_LICENSES: "true"
        soft_fail: true
        agents:
          queue: kube-operator-standard
        matrix: &binary_targets
          setup:
            os:
              - darwin
              - freebsd
              - linux
              - openbsd
              - windows
            arch:
              - "386"
              - amd64
              - arm64
          adjustments:
            - with: { os: darwin, arch: "386" }
              skip: "macOS no longer supports x86 binaries"
            - with: { os: dragonflybsd, arch: amd64 }
            - with: { os: linux, arch: arm }
            - with: { os: linux, arch: armhf }
            - with: { os: linux, arch: ppc64 }
            - with: { os: linux, arch: ppc64le }
            - with: { os: linux, arch: mips64le }
            - with: { os: linux, arch: s390x }
            - with: { os: linux, arch: riscv64 }
            - with: { os: netbsd, arch: amd64 }
            - with: { os: openbsd, arch: arm64 }
              skip: "arm64 OpenBSD is not currently supported"

  # The same steps in an image:, keyed separately.
  - group: ":kubernetes::docker: Kube operator Docker queues"
    steps:
      - <<: *lint
        key: kube-mirror-check-code-committed
        image: &image golang:1.26.5
        matrix: &docker_queues
          - kube-operator-sysbox
          - kube-operator-sysbox-ephemeral
          - kube-operator-dind
          - kube-operator-dind-ephemeral
      - <<: *protobuf
        key: kube-mirror-check-protobuf-generation
        image: *image
        matrix: *docker_queues
      - <<: *tests
        key: kube-mirror-test-linux-amd64
        image: *image
        matrix: *docker_queues
      - <<: *race
        key: kube-mirror-test-race
        image: *image
        matrix: *docker_queues

      - <<: *binary
        name: ":{{matrix.os}}: Build {{matrix.os}} {{matrix.arch}} binary on kube-operator-sysbox"
        key: kube-mirror-build-binary-sysbox
        image: *image
        artifact_paths: "pkg/*"
        agents:
          queue: kube-operator-sysbox
      - <<: *binary
        name: ":{{matrix.os}}: Build {{matrix.os}} {{matrix.arch}} binary on kube-operator-dind"
        key: kube-mirror-build-binary-dind
        image: *image
        agents:
          queue: kube-operator-dind

      # Mirrors ":docker: {{matrix}} image build" without pushing: passing an
      # image tag makes build-docker-image.sh skip the ECR push. It still
      # builds for amd64 and arm64, then loads and tests the native image.
      # buildkite/agent:4 has bash, the Docker CLI and buildx.
      - name: ":docker: {{matrix.variant}} image build on {{matrix.queue}}"
        key: kube-mirror-build-docker
        command: .buildkite/steps/build-docker-image.sh {{matrix.variant}} buildkite-agent-kube-mirror:{{matrix.variant}}
        image: buildkite/agent:4
        soft_fail: true
        depends_on: kube-mirror-build-binary-sysbox
        agents:
          queue: "{{matrix.queue}}"
        matrix:
          setup:
            variant:
              - alpine
              - alpine-k8s
              - ubuntu-20.04
              - ubuntu-22.04
              - ubuntu-24.04
              - ubuntu-26.04
              - sidecar
            queue: *docker_queues
