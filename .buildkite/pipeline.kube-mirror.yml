# EXPERIMENT: lint steps mirrored onto the kube-operator queues in the Agent
# cluster. Uploaded unsigned by the upload-kube-mirror step in pipeline.yml.
# Soft-fail and nothing depends on them. The standard queues have no Docker
# and are expected to fail.

steps:
  - group: ":kubernetes: Kube operator lint mirror"
    steps:
      - name: ":go::robot_face: Lint on {{matrix}}"
        key: kube-mirror-check-code-committed
        command: .buildkite/steps/check-code-committed.sh
        soft_fail: true
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: "git@github.com:"
        agents:
          queue: "{{matrix}}"
        matrix: &kube_operator_queues
          - kube-operator-standard
          - kube-operator-standard-ephemeral
          - kube-operator-sysbox
          - kube-operator-sysbox-ephemeral
          - kube-operator-dind
          - kube-operator-dind-ephemeral
        plugins:
          - docker-compose#v5.15.0:
              config: .buildkite/docker-compose.yml
              cli-version: 2
              mount-buildkite-agent: true
              run: lint
              env:
                - BUILDKITE_AGENT_ACCESS_TOKEN
                - BUILDKITE_AGENT_CACHE_REGISTRY
                - BUILDKITE_AGENT_CACHE_STORE_URL
                - AWS_ACCESS_KEY_ID
                - AWS_SECRET_ACCESS_KEY
                - AWS_SESSION_TOKEN

      - name: ":go::robot_face: Check protobuf generation on {{matrix}}"
        key: kube-mirror-check-protobuf-generation
        env:
          GOBIN: /root/.protobuf-tools/bin
          GOCACHE: /root/.protobuf-tools/gocache
          GOMODCACHE: /root/.protobuf-tools/gomodcache
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: "git@github.com:"
        command: .buildkite/steps/check-protobuf-generation.sh
        soft_fail: true
        agents:
          queue: "{{matrix}}"
        matrix: *kube_operator_queues
        plugins:
          - docker-compose#v5.15.0:
              config: .buildkite/docker-compose.yml
              cli-version: 2
              mount-buildkite-agent: true
              run: lint
              env:
                - BUILDKITE_AGENT_ACCESS_TOKEN
                - BUILDKITE_AGENT_CACHE_REGISTRY
                - BUILDKITE_AGENT_CACHE_STORE_URL
                - AWS_ACCESS_KEY_ID
                - AWS_SECRET_ACCESS_KEY
                - AWS_SESSION_TOKEN
                - GOBIN
                - GOCACHE
                - GOMODCACHE
