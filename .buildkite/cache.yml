caches:
  - name: gomodcache
    cache_key:
      - v2
      - { agent: os }
      - { agent: arch }
      - { checksum: go.sum }
    # ~-anchored: resolved against $HOME, independent of cwd
    target_paths:
      - ~/.gomodcache
  - name: gocache
    cache_key:
      - v2
      - { agent: os }
      - { agent: arch }
    target_paths:
      - ~/.gocache
