# Shared Cache v2 definitions used to measure warm-cache CI performance.
caches:
  - name: gomodcache
    # Prefer an exact go.mod match, while allowing a compatible cache from the
    # same OS, architecture, and Go version as a fallback.
    cache_key:
      - agent-go-modules-v1
      - { agent: os }
      - { agent: arch }
      - { env: AGENT_GO_VERSION, fallback_limit: true }
      - { checksum: go.mod }
    target_paths:
      - ~/.gomodcache

  - name: gocache
    # Save an exact entry for each commit, with fallback to an earlier cache
    # built by the same OS, architecture, and Go version.
    cache_key:
      - agent-go-build-v1
      - { agent: os }
      - { agent: arch }
      - { env: AGENT_GO_VERSION, fallback_limit: true }
      - { checksum: go.mod }
      - { agent: branch }
      - { env: BUILDKITE_COMMIT }
    target_paths:
      - ~/.gocache

  - name: gocache_race
    # Race builds use different compiled objects, so keep them separate from
    # the normal Go build cache.
    cache_key:
      - agent-go-build-race-v1
      - { agent: os }
      - { agent: arch }
      - { env: AGENT_GO_VERSION, fallback_limit: true }
      - { checksum: go.mod }
      - { agent: branch }
      - { env: BUILDKITE_COMMIT }
    target_paths:
      - ~/.gocache_race

  - name: target_gocache
    # Cross-compiled objects are reusable only for the same target and build
    # mode. Save an exact entry for each commit, with fallback to an earlier
    # cache built for the same target and Go toolchain.
    cache_key:
      - agent-go-target-build-v1
      - { env: TARGET_GOOS }
      - { env: TARGET_GOARCH }
      - { env: TARGET_GOARM }
      - { env: TARGET_BUILD_MODE }
      - { env: TARGET_GO_VERSION, fallback_limit: true }
      - { checksum: go.mod }
      - { env: BUILDKITE_COMMIT }
    target_paths:
      - ~/.gocache-target

  - name: e2e_gomodcache
    # The triggered E2E pipeline has one job, so it can safely own both its
    # module cache and its compiled test cache without competing writers.
    cache_key:
      - agent-e2e-go-modules-v1
      - { agent: os }
      - { agent: arch }
      - { env: E2E_GO_VERSION, fallback_limit: true }
      - { checksum: go.mod }
    target_paths:
      - ~/.e2e-gomodcache

  - name: e2e_gocache
    # Reuse compiled E2E test objects from the latest compatible commit on the
    # same branch, while retaining an exact entry for the current commit.
    cache_key:
      - agent-e2e-go-build-v1
      - { agent: os }
      - { agent: arch }
      - { env: E2E_GO_VERSION, fallback_limit: true }
      - { checksum: go.mod }
      - { agent: branch }
      - { env: BUILDKITE_COMMIT }
    target_paths:
      - ~/.e2e-gocache

  - name: bk_cli
    # The pinned bk executable is immutable for a Go target. Cache only the
    # installed binary instead of restoring the Agent repository's Go caches.
    cache_key:
      - bk-cli-v1
      - { env: BK_CLI_COMMIT }
      - { env: BK_CLI_GOOS }
      - { env: BK_CLI_GOARCH }
    target_paths:
      - ~/.bk-cli/bin

  - name: protobuf_tools
    # Cache the installed protobuf tools as well as the Go caches used to build
    # them. Any toolchain or tool version change gets a fresh entry.
    cache_key:
      - protobuf-tools-v1
      - { agent: os }
      - { agent: arch }
      - { env: PROTOBUF_GO_VERSION }
      - { env: PROTOBUF_BUF_VERSION }
      - { env: PROTOBUF_PROTOC_GEN_GO_VERSION }
      - { env: PROTOBUF_PROTOC_GEN_CONNECT_GO_VERSION }
    target_paths:
      - ~/.protobuf-tools/bin
      - ~/.protobuf-tools/gocache
      - ~/.protobuf-tools/gomodcache
