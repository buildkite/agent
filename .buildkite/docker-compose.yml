services:
  lint:
    build:
      context: .
      dockerfile: Dockerfile-lint
    volumes:
      - ../:/work:cached
    working_dir: /work
    environment:
      # NOT inside /work (git's own checkout-wipe logic doesn't chmod
      # read-only Go module cache files before removing them, unlike cache
      # v2's own cleanPath) and NOT a host bind mount (that's finding #3 --
      # the kernel refuses to unlink a mount point's own directory entry).
      # A plain, non-mounted, non-checkout path avoids both.
      - GOCACHE=/.gocache
      - GOMODCACHE=/.gomodcache

  agent:
    build:
      context: .
      dockerfile: Dockerfile-compile
    volumes:
      - ../:/work:cached
    working_dir: /work
    environment:
      - BUILDKITE_BUILD_NUMBER
      - BUILDKITE_JOB_ID
      - "BUILDKITE_AGENT_TAGS=queue=default"
      - "BUILDKITE_BUILD_PATH=/buildkite"
      # See the lint service's GOCACHE/GOMODCACHE comment above.
      - GOCACHE=/.gocache
      - GOMODCACHE=/.gomodcache
      - BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN

  e2e:
    build:
      context: .
      dockerfile: Dockerfile-e2e
    volumes:
      - ../:/work:cached
    working_dir: /work
    environment:
      - BUILDKITE_BUILD_NUMBER
      - BUILDKITE_JOB_ID
      - BUILDKITE_BUILD_CREATOR_EMAIL
      - BUILDKITE_BUILD_CREATOR
      - BUILDKITE_TRIGGERED_FROM_BUILD_ID
      - CI_E2E_TESTS_BUILDKITE_API_TOKEN
      - CI_E2E_TESTS_AGENT_TOKEN

  ruby:
    build:
      context: .
      dockerfile: Dockerfile-ruby
    volumes:
      - ..:/work
      - ruby-agent-gem-cache:/usr/local/bundle
    working_dir: /work
    command: /bin/bash
    environment:
      - FULL_AGENT_VERSION
      - AGENT_VERSION
      - BUILD_VERSION

volumes:
  ruby-agent-gem-cache: ~
