services:
  lint:
    build:
      context: .
      dockerfile: Dockerfile-lint
    volumes:
      - ../:/work:cached
    working_dir: /work
    # GOCACHE/GOMODCACHE are set to $HOME/.gocache and $HOME/.gomodcache by
    # the scripts themselves (see check-code-committed.sh /
    # check-protobuf-generation.sh), matching cache.yml's ~-anchored
    # target_paths -- not set here, so there's exactly one place that can
    # get the two out of sync.

  agent:
    build:
      context: .
      dockerfile: Dockerfile-compile
    volumes:
      - ../:/work:cached
    working_dir: /work
    environment:
      - BUILDKITE_BUILD_NUMBER
      - BUILDKITE_JOB_ID
      - "BUILDKITE_AGENT_TAGS=queue=default"
      - "BUILDKITE_BUILD_PATH=/buildkite"
      - BUILDKITE_TEST_ENGINE_API_ACCESS_TOKEN

  e2e:
    build:
      context: .
      dockerfile: Dockerfile-e2e
    volumes:
      - ../:/work:cached
    working_dir: /work
    environment:
      - BUILDKITE_BUILD_NUMBER
      - BUILDKITE_JOB_ID
      - BUILDKITE_BUILD_CREATOR_EMAIL
      - BUILDKITE_BUILD_CREATOR
      - BUILDKITE_TRIGGERED_FROM_BUILD_ID
      - CI_E2E_TESTS_BUILDKITE_API_TOKEN
      - CI_E2E_TESTS_AGENT_TOKEN

  ruby:
    build:
      context: .
      dockerfile: Dockerfile-ruby
    volumes:
      - ..:/work
      - ruby-agent-gem-cache:/usr/local/bundle
    working_dir: /work
    command: /bin/bash
    environment:
      - FULL_AGENT_VERSION
      - AGENT_VERSION
      - BUILD_VERSION

volumes:
  ruby-agent-gem-cache: ~
