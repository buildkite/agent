syntax = "proto3";

package agentedge.v1;

message StreamPingsRequest {
  string agent_id = 1;
  // Agent release version without the User-Agent build-number suffix.
  // Older agents omit this field and won't receive stream keepalives.
  string agent_version = 2;
}

message StreamPingsResponse {
  reserved 1;
  reserved "endpoint";

  oneof action {
    ResumeAction resume = 2;
    PauseAction pause = 3;
    DisconnectAction disconnect = 4;
    JobAssignedAction job_assigned = 5;
    KeepaliveAction keepalive = 7;
  }

  RequestHeaders request_headers = 6;
}

message RequestHeaders {
  map<string, string> values = 1;
}

message ResumeAction {}

message PauseAction {
  string reason = 1;
}

message DisconnectAction {
  string reason = 1;
}

message JobAssignedAction {
  Job job = 1;
}

// Keeps the stream active without changing agent state.
message KeepaliveAction {}

message Job {
  string id = 1;
}

service AgentEdgeService {
  rpc StreamPings(StreamPingsRequest) returns (stream StreamPingsResponse) {}
}
